components:
  schemas:
    Card:
      type: object
      properties:
        number:
          type: string
          maxLength: 13
        barcode_value:
          type: string
          readOnly: true
      required:
      - barcode_value
      - number
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          maxLength: 120
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - id
      - name
      - slug
    FlyerDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        valid_from:
          type: string
          format: date
        valid_to:
          type: string
          format: date
        cover_image:
          type: string
          format: uri
          nullable: true
        offers:
          type: array
          items:
            $ref: '#/components/schemas/Offer'
          readOnly: true
      required:
      - id
      - offers
      - title
      - valid_from
      - valid_to
    FlyerList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        valid_from:
          type: string
          format: date
        valid_to:
          type: string
          format: date
        cover_image:
          type: string
          format: uri
          nullable: true
        offer_count:
          type: integer
          readOnly: true
      required:
      - id
      - offer_count
      - title
      - valid_from
      - valid_to
    ImageUploadRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: JPEG, PNG or WebP image, max 5 MB.
      required:
      - file
    ImageUploadResult:
      type: object
      properties:
        url:
          type: string
          format: uri
        name:
          type: string
      required:
      - name
      - url
    ListItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product:
          type: integer
          nullable: true
        text:
          type: string
          maxLength: 200
        quantity:
          type: integer
          maximum: 999
          minimum: 1
        checked:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - updated_at
    ListItemRequest:
      type: object
      properties:
        product:
          type: integer
          nullable: true
        text:
          type: string
          maxLength: 200
        quantity:
          type: integer
          maximum: 999
          minimum: 1
        checked:
          type: boolean
    LogoutRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    Me:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        name:
          type: string
          maxLength: 150
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
      required:
      - email
      - id
      - role
    Offer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        flyer:
          type: integer
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        old_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        badge_text:
          type: string
          maxLength: 60
        valid_from:
          type: string
          format: date
          nullable: true
        valid_to:
          type: string
          format: date
          nullable: true
        product:
          allOf:
          - $ref: '#/components/schemas/Product'
          readOnly: true
      required:
      - flyer
      - id
      - price
      - product
    OfferFields:
      type: object
      description: Offer fields without the flyer; validates everything the DB constraints
        enforce.
      properties:
        id:
          type: integer
          readOnly: true
        product:
          type: integer
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        old_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        badge_text:
          type: string
          maxLength: 60
        sort_order:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        valid_from:
          type: string
          format: date
          nullable: true
        valid_to:
          type: string
          format: date
          nullable: true
      required:
      - id
      - price
      - product
