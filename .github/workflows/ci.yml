name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/app
      SECRET_KEY: ci-secret-key
      # The platform kit (regisse_kit) is in the private platform repo: a read-only token (fine-grained PAT, Contents: read on regisse-platform)
      # stored as the repository secret PLATFORM_READ_TOKEN lets CI install it. Without it the SSO tests are not collected and the accounts
      # coverage gate is skipped (they supply most of that coverage), with a warning.
      HAS_KIT_TOKEN: ${{ secrets.PLATFORM_READ_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Platform kit (private repo)
        if: env.HAS_KIT_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/regisse-platform
          path: platform
          token: ${{ secrets.PLATFORM_READ_TOKEN }}
      - name: Warn when the kit is missing
        if: env.HAS_KIT_TOKEN != 'true'
        run: |
          echo "::warning::PLATFORM_READ_TOKEN is not set. The platform kit is not installed, the SSO and observability tests are skipped and the accounts coverage gate is not enforced."
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Install the platform kit
        if: env.HAS_KIT_TOKEN == 'true'
        run: pip install "../platform/kit[sso,django]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy .
      - run: pytest --cov
      - name: Coverage gate (accounts)
        if: env.HAS_KIT_TOKEN == 'true'
        run: coverage report --include="accounts/*" --fail-under=85
      - name: Coverage gate (offers)
        run: coverage report --include="offers/*" --fail-under=85
      - name: Coverage gate (shopping)
        run: coverage report --include="shopping/*" --fail-under=85
      - name: Deploy check with production settings
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          SECRET_KEY: ci-0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJK
          DATABASE_URL: postgres://app:app@localhost:5432/app
          ALLOWED_HOSTS: api.example.com
        run: python manage.py check --deploy --fail-level WARNING
      - name: OpenAPI contract is up to date
        run: |
          python manage.py spectacular --file openapi.yaml --validate --fail-on-warn
          git diff --exit-code -- openapi.yaml

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t supermarket-backend backend/
      - name: Image runs as non-root and has no dev tooling
        run: |
          test "$(docker run --rm supermarket-backend id -u)" != "0"
          if docker run --rm supermarket-backend python -c "import pytest"; then
            echo "pytest is present in the production image" >&2
            exit 1
          fi

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.2
          channel: stable
          cache: true
      # The Dart sqlite3 package loads libsqlite3.so; the runner only ships
      # libsqlite3.so.0 without the dev symlink, so the DB tests would fail.
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      - name: API client is up to date with backend/openapi.yaml
        working-directory: .
        run: app/tool/check_api_drift.sh
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test --exclude-tags golden
      # Compile check only; no device or emulator is started in CI.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Gradle downloads are cached between runs (keyed on the files that decide the dependencies): once warm, the build downloads almost nothing.
      # repo.maven.apache.org rate-limits (HTTP 429) the shared addresses of GitHub's runners, so downloads also retry with an exponential backoff.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle', 'app/android/gradle/wrapper/gradle-wrapper.properties', 'app/pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Gradle download retries
        working-directory: .
        run: |
          mkdir -p ~/.gradle
          {
            echo "systemProp.org.gradle.internal.repository.max.tentatives=10"
            echo "systemProp.org.gradle.internal.repository.initial.backoff=2000"
            echo "systemProp.org.gradle.internal.http.connectionTimeout=60000"
            echo "systemProp.org.gradle.internal.http.socketTimeout=60000"
          } >> ~/.gradle/gradle.properties
      - name: Build the Android debug APK
        # Up to 3 attempts, 90 s apart: a download refused by a repository (429, timeouts) is not a code error, a real compile error fails all three.
        run: |
          for attempt in 1 2 3; do
            flutter build apk --debug --dart-define-from-file=env/dev.json && exit 0
            echo "::warning::build attempt $attempt failed"; sleep 90
          done
          exit 1
