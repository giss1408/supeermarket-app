name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/app
      SECRET_KEY: ci-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy .
      - run: pytest --cov
      - name: Coverage gate (accounts)
        run: coverage report --include="accounts/*" --fail-under=85
      - name: Coverage gate (offers)
        run: coverage report --include="offers/*" --fail-under=85
      - name: Coverage gate (shopping)
        run: coverage report --include="shopping/*" --fail-under=85
      - name: Deploy check with production settings
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          SECRET_KEY: ci-0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJ
          DATABASE_URL: postgres://app:app@localhost:5432/app
          ALLOWED_HOSTS: api.example.com
        run: python manage.py check --deploy --fail-level WARNING
      - name: OpenAPI contract is up to date
        run: |
          python manage.py spectacular --file openapi.yaml --validate --fail-on-warn
          git diff --exit-code -- openapi.yaml

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t supermarket-backend backend/
      - name: Image runs as non-root and has no dev tooling
        run: |
          test "$(docker run --rm supermarket-backend id -u)" != "0"
          if docker run --rm supermarket-backend python -c "import pytest"; then
            echo "pytest is present in the production image" >&2
            exit 1
          fi
